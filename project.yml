name: Takes
options:
  bundleIdPrefix: app.takes
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    # Stable local identity from scripts/setup-signing.sh, so macOS permissions survive rebuilds.
    CODE_SIGN_IDENTITY: "Takes Local Signing"
    OTHER_CODE_SIGN_FLAGS: "--keychain $(HOME)/Library/Keychains/takes-signing.keychain-db"
    ENABLE_HARDENED_RUNTIME: NO
    DEVELOPMENT_TEAM: ""
targets:
  Takes:
    type: application
    platform: macOS
    sources:
      - path: Takes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.takes.Takes
        PRODUCT_NAME: Takes
        INFOPLIST_FILE: Takes/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Takes/Resources/Takes.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
