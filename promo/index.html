<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F4F5FA; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="57" data-width="1080" data-height="1920">

      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="9" data-duration="4"

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
